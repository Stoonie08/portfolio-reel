<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stoney Jimenez | Portfolio reel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:white;font:16px system-ui}
main{height:100vh;height:100dvh;position:relative;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(min-aspect-ratio:1/1){iframe{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:max(100vw,177.78vh);height:max(100vh,56.25vw)}}
nav{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:4%;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px;border-radius:12px;background:#161616e8;max-width:92%}
button,a{color:white;background:transparent;border:1px solid #888;border-radius:6px;font:inherit;padding:8px;text-decoration:none;cursor:pointer}input{width:86px;accent-color:white}label{display:flex;align-items:center;gap:5px}[hidden]{display:none}
</style>
<main><iframe id="video" title="Stoney Jimenez portfolio reel" src="https://player.vimeo.com/video/1213101749?autoplay=1&amp;muted=1&amp;loop=1&amp;playsinline=1&amp;controls=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
<nav aria-label="Video controls"><button id="play" hidden>Play</button><button id="sound" hidden>Unmute</button><label id="level" hidden>Volume <input id="vol" type="range" min="0" max="100" value="0"></label><a id="fallback" href="https://vimeo.com/1213101749" target="_blank" rel="noopener">Watch on Vimeo</a></nav></main>
<script src="https://player.vimeo.com/api/player.js"></script>
<script>
if(window.Vimeo){
 const el=id=>document.getElementById(id);
 const player=new Vimeo.Player(el('video'));
 let lastVolume=0.7;
 const fallback=()=>{el('fallback').hidden=false};
 const sync=async()=>{
   const [paused,muted,volume]=await Promise.all([player.getPaused(),player.getMuted(),player.getVolume()]);
   el('play').textContent=paused?'Play':'Pause';
   el('sound').textContent=muted||volume===0?'Unmute':'Mute';
   el('vol').value=muted?0:Math.round(volume*100);
   if(!muted&&volume>0)lastVolume=volume;
 };
 player.ready().then(async()=>{
   await sync();
   for(const id of ['play','sound','level'])el(id).hidden=false;
   el('fallback').hidden=true;
 }).catch(fallback);
 for(const event of ['play','pause','volumechange'])player.on(event,()=>sync().catch(fallback));
 player.on('error',fallback);
 el('play').onclick=async()=>{try{if(await player.getPaused())await player.play();else await player.pause();await sync()}catch{fallback()}};
 el('sound').onclick=async()=>{try{if(await player.getMuted()||await player.getVolume()===0){await player.setVolume(lastVolume);await player.setMuted(false)}else await player.setMuted(true);await sync()}catch{fallback()}};
 el('vol').onchange=async e=>{const v=Number(e.target.value)/100;try{await player.setVolume(v);await player.setMuted(v===0);await sync()}catch{fallback()}};
}
</script></html>
